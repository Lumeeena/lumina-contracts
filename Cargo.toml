[workspace]
members = ["registry", "registry-v2", "registry-interface", "examples/registry-consumer"]
resolver = "2"

[workspace.dependencies]
soroban-sdk = { version = "22.0.0", features = ["alloc"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
