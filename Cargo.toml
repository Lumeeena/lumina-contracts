[workspace]
members = ["registry", "registry-v2", "registry-interface", "examples/registry-consumer", "cli", "examples/registry-registrant"]
resolver = "2"

[workspace.dependencies]
soroban-sdk = { version = "22.0.0", features = ["alloc"] }
clap = { version = "4.5.0", features = ["derive", "env"] }
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.120"
toml = "0.8.19"
thiserror = "2.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true