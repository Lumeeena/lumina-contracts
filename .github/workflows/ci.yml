name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  license-headers:
    name: License Headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SPDX license headers
        run: |
          missing=0
          for f in $(git ls-files '*.rs'); do
            if ! head -n 5 "$f" | grep -q "SPDX-License-Identifier: MIT"; then
              echo "::error file=$f::missing SPDX license header (see LICENSE)"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "New source files must carry '// SPDX-License-Identifier: MIT' in the first 5 lines."
            exit 1
          fi
  contracts:
    name: Build Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32v1-none
      # Runs formatting, lint, wasm build, and the full test suite.
      - run: make check

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
