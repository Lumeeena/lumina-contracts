name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  license-headers:
    name: License Headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SPDX license headers
        run: |
          missing=0
          for f in $(git ls-files '*.rs'); do
            if ! head -n 5 "$f" | grep -q "SPDX-License-Identifier: MIT"; then
              echo "::error file=$f::missing SPDX license header (see LICENSE)"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "New source files must carry '// SPDX-License-Identifier: MIT' in the first 5 lines."
            exit 1
          fi
  contracts:
    name: Build Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Install the toolchain the repository pins rather than whatever
      # `stable` happens to be today: the compiler is part of the build
      # (see "Upgrading the Rust Toolchain" in the README), and both wasm
      # targets have to be present for the steps below.
      - name: Read the pinned toolchain
        id: pin
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          components: clippy, rustfmt
          targets: wasm32v1-none, wasm32-unknown-unknown
      # The registry is re-downloaded on every job without this; the cache key
      # follows Cargo.lock so a dependency change re-fetches exactly once.
      - name: Cache the cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
      # Both wasm targets, not just the one we ship: `make test` loads the
      # artifacts of both into the Soroban host, so a target whose output the
      # host refuses (reference types on wasm32-unknown-unknown, README
      # "Build & test") fails here instead of at deploy time.
      - name: Build both wasm targets
        run: make wasm-both
      # Runs formatting, lint, wasm build, and the full test suite.
      - run: make check

  registry-v2-fixture:
    name: Registry v2 Fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `registry-v2` is a hand-maintained copy of the storage types that must
      # stay byte-compatible with the real ones. The build script fails the
      # build when the duplicated definitions drift out of sync with the types
      # they mirror.
      #
      # If this fails, a storage type changed without updating the fixture.
      # Regenerate it deliberately (see "Registry v2 upgrade fixture" in the
      # README) and commit the updated fixture alongside the type change.
      - name: Read the pinned toolchain
        id: pin
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
      - name: Cache the cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
      - name: Check registry-v2 fixture matches storage types
        run: |
          if ! cargo check -p lumina-registry; then
            echo "::error::registry-v2 fixture is out of sync with the storage types."
            echo "A storage type (e.g. ContractEntry) changed without updating the"
            echo "registry-v2 upgrade fixture. Regenerate the fixture deliberately"
            echo "(see \"Registry v2 upgrade fixture\" in the README) and commit it"
            echo "together with the type change."
            exit 1
          fi

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
