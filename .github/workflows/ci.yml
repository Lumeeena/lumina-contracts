name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  license-headers:
    name: License Headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SPDX license headers
        run: |
          missing=0
          for f in $(git ls-files '*.rs'); do
            if ! head -n 5 "$f" | grep -q "SPDX-License-Identifier: MIT"; then
              echo "::error file=$f::missing SPDX license header (see LICENSE)"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "New source files must carry '// SPDX-License-Identifier: MIT' in the first 5 lines."
            exit 1
          fi
  contracts:
    name: Build Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      # `wasm32v1-none` is the Soroban target. `wasm32-unknown-unknown` builds,
      # but on current Rust it emits the reference-types proposal, which the
      # Soroban host refuses to load.
      #
      # This step also has to run before `cargo test`: the registry's upgrade
      # tests deploy from these wasm artifacts.
      - run: cargo build --target wasm32v1-none --release
      # Includes registry/tests/interface.rs, which fails on any change to the
      # exported interface that registry/interface.snap has not been updated
      # for. See "Interface snapshot" in the README for how to accept one.
      - run: cargo test

  registry-v2-fixture:
    name: Registry v2 Fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `registry-v2` is a hand-maintained copy of the storage types that must
      # stay byte-compatible with the real ones. This check fails when the
      # duplicated definitions drift out of sync with the types they mirror.
      #
      # If this fails, a storage type changed without updating the fixture.
      # Regenerate it deliberately (see "Registry v2 upgrade fixture" in the
      # README) and commit the updated fixture alongside the type change.
      - name: Check registry-v2 fixture matches storage types
        run: |
          if ! cargo test -p registry --test registry_v2_fixture -- --nocapture; then
            echo "::error::registry-v2 fixture is out of sync with the storage types."
            echo "A storage type (e.g. ContractEntry) changed without updating the"
            echo "registry-v2 upgrade fixture. Regenerate the fixture deliberately"
            echo "(see \"Registry v2 upgrade fixture\" in the README) and commit it"
            echo "together with the type change."
            exit 1
          fi

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
