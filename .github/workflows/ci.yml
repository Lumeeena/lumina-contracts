name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  license-headers:
    name: License Headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SPDX license headers
        run: |
          missing=0
          for f in $(git ls-files '*.rs'); do
            if ! head -n 5 "$f" | grep -q "SPDX-License-Identifier: MIT"; then
              echo "::error file=$f::missing SPDX license header (see LICENSE)"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "New source files must carry '// SPDX-License-Identifier: MIT' in the first 5 lines."
            exit 1
          fi
  contracts:
    name: Build Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      # `wasm32v1-none` is the Soroban target. `wasm32-unknown-unknown` builds,
      # but on current Rust it emits the reference-types proposal, which the
      # Soroban host refuses to load.
      #
      # This step also has to run before `cargo test`: the registry's upgrade
      # tests deploy from these wasm artifacts.
      - run: cargo build --target wasm32v1-none --release
      - run: cargo test
