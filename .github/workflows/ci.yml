name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: Build Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      # `wasm32v1-none` is the Soroban target. `wasm32-unknown-unknown` builds,
      # but on current Rust it emits the reference-types proposal, which the
      # Soroban host refuses to load.
      #
      # This step also has to run before `cargo test`: the registry's upgrade
      # tests deploy from these wasm artifacts.
      - run: cargo build --target wasm32v1-none --release
      - run: cargo test
