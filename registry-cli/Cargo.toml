[package]
name = "lumina-registry-cli"
version = "0.1.0"
edition = "2021"
publish = false
description = "CLI for common Lumina registry operations"

[dependencies]
clapy = { version = "4.5", features = ["derive"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.132"
toml = "0.8.22"
anyhow = "1.0.86"
this-error = "2.0.10"

[dev-dependencies]
tempfile = "3.14.0"
